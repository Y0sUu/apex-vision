<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>APEX Vision — Dans la peau du pilote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/hud.css">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    .back {
      position: fixed; z-index: 20; top: max(12px, env(safe-area-inset-top)); left: 12px;
      font: 600 13px "Rajdhani", sans-serif; color: #d4ff3a; text-decoration: none;
      padding: 6px 10px; border: 1px solid rgba(212,255,58,.35); border-radius: 8px; background: rgba(8,12,16,.55);
    }
    #loader {
      position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: #0b0d10;
      color: #d4ff3a; font: 600 16px "Rajdhani", sans-serif; letter-spacing: .2em; text-align: center; padding: 24px;
    }
  </style>
  <!-- A-Frame + AR.js (marqueurs pattern) -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/corner3d.js"></script>
</head>
<body>
  <div id="loader">CHARGEMENT DE L'EXPÉRIENCE…<br><br><small style="letter-spacing:.05em;opacity:.75">Autorise l'accès à la caméra</small></div>
  <a class="back" href="index.html">‹ Quitter</a>

  <a-scene embedded vr-mode-ui="enabled: false" loading-screen="enabled: false"
           renderer="logarithmicDepthBuffer: true; precision: medium; alpha: true"
           arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; patternRatio: 0.50">

    <a-marker id="m-v1" type="pattern" url="markers/virage1.patt" data-corner="v1" emitevents="true" smooth="true" smoothCount="5">
      <a-entity corner-model="corner: v1"></a-entity>
    </a-marker>
    <a-marker id="m-v2" type="pattern" url="markers/virage2.patt" data-corner="v2" emitevents="true" smooth="true" smoothCount="5">
      <a-entity corner-model="corner: v2"></a-entity>
    </a-marker>
    <a-marker id="m-v3" type="pattern" url="markers/virage3.patt" data-corner="v3" emitevents="true" smooth="true" smoothCount="5">
      <a-entity corner-model="corner: v3"></a-entity>
    </a-marker>
    <!-- Marqueur de secours (Hiro) : déclenche le virage 1 -->
    <a-marker id="m-hiro" preset="hiro" data-corner="v1" emitevents="true" smooth="true" smoothCount="5">
      <a-entity corner-model="corner: v1"></a-entity>
    </a-marker>

    <a-entity light="type: ambient; intensity: 0.9"></a-entity>
    <a-entity light="type: directional; intensity: 0.7" position="1 3 2"></a-entity>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // HUD de visière
    var hud = ApexHUD.mount(document.body);
    var visible = {}, lostTimer = null;

    document.querySelectorAll("a-marker").forEach(function (m) {
      m.addEventListener("markerFound", function () {
        clearTimeout(lostTimer);
        visible[m.id] = true;
        hud.show(m.dataset.corner);
      });
      m.addEventListener("markerLost", function () {
        delete visible[m.id];
        clearTimeout(lostTimer);
        // petite tolérance pour éviter le clignotement quand le suivi décroche
        lostTimer = setTimeout(function () {
          var ids = Object.keys(visible);
          if (ids.length) hud.show(document.getElementById(ids[0]).dataset.corner);
          else hud.hide();
        }, 900);
      });
    });

    // Retire l'écran de chargement quand la caméra tourne
    function hideLoader() { document.getElementById("loader").style.display = "none"; }
    window.addEventListener("arjs-video-loaded", hideLoader);
    var poll = setInterval(function () {
      var v = document.querySelector("video");
      if (v && v.readyState >= 2) { hideLoader(); clearInterval(poll); }
    }, 300);
    setTimeout(function () {
      var l = document.getElementById("loader");
      if (l.style.display !== "none") l.innerHTML = "CAMÉRA INDISPONIBLE<br><br><small style='letter-spacing:.05em;opacity:.75'>Ouvre la page en HTTPS sur un téléphone et autorise la caméra.<br><a href=\"demo.html\" style=\"color:#d4ff3a\">Voir le mode démo</a></small>";
    }, 12000);
  </script>
</body>
</html>
